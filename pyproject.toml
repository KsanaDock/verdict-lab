[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "verdict-lab"
version = "0.1.0"
description = "Reproducible comparison of structured content-moderation models"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.27,<1",
]

[project.scripts]
verdict-lab = "verdict_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

